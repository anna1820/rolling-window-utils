[project]
name = "rolling-window-utils"
version = "0.1.0"
description = "Rolling window over a number stream with O(1) mean and O(n) peak/trough"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
